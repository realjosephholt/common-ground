name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The contributor's path: no Docker, no database, no services. If this job needs
  # anything installed, the promise in CONTRIBUTING.md has been broken.
  pglite:
    name: Tests (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The authoritative path. PGlite is a WASM build and is not byte-identical to server
  # Postgres, so local is fast and this is what a divergence surfaces against.
  postgres:
    name: Tests (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: common_ground_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/common_ground_test
